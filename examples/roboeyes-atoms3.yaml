# RoboEyes on an M5Stack AtomS3 (ESP32-S3, GC9107 128x128).
#
# Every RoboEyes option is exposed to Home Assistant, so all of them can be
# tried without reflashing: mood, position, auto blink, idle looking around,
# curiosity, cyclops, sweat, flicker, and the one-shot animations.
#
# esphome_roboeyes is GPL-3.0-or-later (it includes FluxGarage RoboEyes),
# so firmware built from this config is GPL-3.0 as well.

esphome:
  name: roboeyes-atoms3
  friendly_name: RoboEyes AtomS3

esp32:
  board: m5stack-atoms3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source: github://pfefferle/esphome-components@main
    components: [esphome_roboeyes]
    refresh: 1d

esphome_roboeyes:

# --- display ---------------------------------------------------------------

spi:
  clk_pin: GPIO17
  mosi_pin: GPIO21

output:
  - platform: ledc
    pin: GPIO16
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    id: lcd_backlight
    name: Display Backlight
    restore_mode: ALWAYS_ON

# The face lives in a global so buttons and selects can reach it too.
globals:
  - id: robo
    type: roboeyes::Face *
    initial_value: new roboeyes::Face()

display:
  - platform: mipi_spi
    model: GC9107
    cs_pin: GPIO15
    dc_pin: GPIO33
    reset_pin: GPIO34
    invert_colors: true
    data_rate: 40MHz
    rotation: 0
    update_interval: 33ms   # the frame rate of the eyes
    lambda: |-
      auto &eyes = id(robo)->eyes();
      static bool configured = false;
      if (!configured) {
        // Sizes once only: these setters also reset the eye animation,
        // so calling them every frame would cancel every blink.
        eyes.setWidth(44, 44);
        eyes.setHeight(44, 44);
        eyes.setBorderradius(12, 12);
        eyes.setSpacebetween(12);
        // Colors: any ESPHome color, e.g. cyan eyes on black
        // id(robo)->set_colors(Color(0, 0, 0), Color(0, 255, 255));
        configured = true;
      }
      // These only store values, so they can follow HA every frame.
      auto mood = id(robo_mood).active_index().value_or(0);
      eyes.setMood(mood);  // 0 default, 1 tired, 2 angry, 3 happy
      eyes.setAutoblinker(id(robo_autoblink).state, 3, 2);
      eyes.setIdleMode(id(robo_idle).state, 2, 2);
      eyes.setCuriosity(id(robo_curious).state);
      eyes.setCyclops(id(robo_cyclops).state);
      eyes.setSweat(id(robo_sweat).state);
      eyes.setHFlicker(id(robo_hflicker).state, 2);
      eyes.setVFlicker(id(robo_vflicker).state, 2);
      id(robo)->draw(it);

# --- Home Assistant controls -----------------------------------------------

select:
  - platform: template
    name: Mood
    id: robo_mood
    optimistic: true
    options: [default, tired, angry, happy]   # same order as roboeyes::DEFAULT..HAPPY
    initial_option: default

  # Where to look. Turn "Idle" off first, otherwise idle mode moves the
  # eyes away again after a moment.
  - platform: template
    name: Position
    id: robo_position
    optimistic: true
    options: [center, n, ne, e, se, s, sw, w, nw]   # roboeyes::DEFAULT, N..NW
    initial_option: center
    on_value:
      - lambda: id(robo)->eyes().setPosition(i);

switch:
  - platform: template
    name: Auto Blink
    id: robo_autoblink
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    name: Idle   # look around on its own
    id: robo_idle
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    name: Curious   # outer eye gets taller when looking far left or right
    id: robo_curious
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    name: Cyclops   # one eye only
    id: robo_cyclops
    optimistic: true
  - platform: template
    name: Sweat
    id: robo_sweat
    optimistic: true
  - platform: template
    name: Horizontal Flicker
    id: robo_hflicker
    optimistic: true
  - platform: template
    name: Vertical Flicker
    id: robo_vflicker
    optimistic: true

button:
  - platform: template
    name: Blink
    on_press:
      - lambda: id(robo)->eyes().blink();
  - platform: template
    name: Laugh   # eyes shake up and down
    on_press:
      - lambda: id(robo)->eyes().anim_laugh();
  - platform: template
    name: Confused   # eyes shake left and right
    on_press:
      - lambda: id(robo)->eyes().anim_confused();
